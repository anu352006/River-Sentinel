<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/proj4.js"></script>
        <script src="js/proj4leaflet.js"></script>
        <script src="data/Linesfinal_2.js"></script>
        <script src="data/network_density_points_5.js"></script>
        <script>
        var crs = new L.Proj.CRS('EPSG:32644', '+proj=utm +zone=44 +datum=WGS84 +units=m +no_defs', {
            resolutions: [2800, 1400, 700, 350, 175, 84, 42, 21, 11.2, 5.6, 2.8, 1.4, 0.7, 0.35, 0.14, 0.07],
        });
        var map = L.map('map', {
            crs: crs,
            continuousWorld: false,
            worldCopyJump: false, 
            zoomControl:false, maxZoom:28, minZoom:1
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
        map.createPane('pane_river_hillshade_0');
        map.getPane('pane_river_hillshade_0').style.zIndex = 400;
        var img_river_hillshade_0 = 'data/river_hillshade_0.png';
        var img_bounds_river_hillshade_0 = [[25.15669219443794,83.05368728529318],[25.257089148767637,83.13474569349565]];
        var layer_river_hillshade_0 = new L.imageOverlay(img_river_hillshade_0,
                                              img_bounds_river_hillshade_0,
                                              {pane: 'pane_river_hillshade_0'});
        bounds_group.addLayer(layer_river_hillshade_0);
        map.addLayer(layer_river_hillshade_0);
        map.createPane('pane_main_river_channel_1');
        map.getPane('pane_main_river_channel_1').style.zIndex = 401;
        var img_main_river_channel_1 = 'data/main_river_channel_1.png';
        var img_bounds_main_river_channel_1 = [[25.15669219443794,83.05368728529318],[25.257089148767637,83.13474569349565]];
        var layer_main_river_channel_1 = new L.imageOverlay(img_main_river_channel_1,
                                              img_bounds_main_river_channel_1,
                                              {pane: 'pane_main_river_channel_1'});
        bounds_group.addLayer(layer_main_river_channel_1);
        map.addLayer(layer_main_river_channel_1);
        function pop_Linesfinal_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['DN'] !== null ? autolinker.link(String(feature.properties['DN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Linesfinal_2_0() {
            return {
                pane: 'pane_Linesfinal_2',
                opacity: 1,
                color: 'rgba(164,113,88,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Linesfinal_2');
        map.getPane('pane_Linesfinal_2').style.zIndex = 402;
        map.getPane('pane_Linesfinal_2').style['mix-blend-mode'] = 'normal';
        var layer_Linesfinal_2 = new L.geoJson(json_Linesfinal_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Linesfinal_2',
            layerName: 'layer_Linesfinal_2',
            pane: 'pane_Linesfinal_2',
            onEachFeature: pop_Linesfinal_2,
            style: style_Linesfinal_2_0,
        });
        bounds_group.addLayer(layer_Linesfinal_2);
        map.addLayer(layer_Linesfinal_2);
        map.createPane('pane_flood_susceptibility_final_3');
        map.getPane('pane_flood_susceptibility_final_3').style.zIndex = 403;
        var img_flood_susceptibility_final_3 = 'data/flood_susceptibility_final_3.png';
        var img_bounds_flood_susceptibility_final_3 = [[25.15669219443794,83.05368728529318],[25.257089148767637,83.13474569349565]];
        var layer_flood_susceptibility_final_3 = new L.imageOverlay(img_flood_susceptibility_final_3,
                                              img_bounds_flood_susceptibility_final_3,
                                              {pane: 'pane_flood_susceptibility_final_3'});
        bounds_group.addLayer(layer_flood_susceptibility_final_3);
        map.addLayer(layer_flood_susceptibility_final_3);
        map.createPane('pane_network_density_4');
        map.getPane('pane_network_density_4').style.zIndex = 404;
        var img_network_density_4 = 'data/network_density_4.png';
        var img_bounds_network_density_4 = [[25.15741273473767,83.05369937863837],[25.257089148767637,83.1348449294726]];
        var layer_network_density_4 = new L.imageOverlay(img_network_density_4,
                                              img_bounds_network_density_4,
                                              {pane: 'pane_network_density_4'});
        bounds_group.addLayer(layer_network_density_4);
        map.addLayer(layer_network_density_4);
        function pop_network_density_points_5(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['DN'] !== null ? autolinker.link(String(feature.properties['DN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['distance'] !== null ? autolinker.link(String(feature.properties['distance']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['angle'] !== null ? autolinker.link(String(feature.properties['angle']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['elevation'] !== null ? autolinker.link(String(feature.properties['elevation']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['SAMPLE_1'] !== null ? autolinker.link(String(feature.properties['SAMPLE_1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_network_density_points_5_0() {
            return {
                pane: 'pane_network_density_points_5',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(133,182,111,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_network_density_points_5');
        map.getPane('pane_network_density_points_5').style.zIndex = 405;
        map.getPane('pane_network_density_points_5').style['mix-blend-mode'] = 'normal';
        var layer_network_density_points_5 = new L.geoJson(json_network_density_points_5, {
            attribution: '',
            interactive: true,
            dataVar: 'json_network_density_points_5',
            layerName: 'layer_network_density_points_5',
            pane: 'pane_network_density_points_5',
            onEachFeature: pop_network_density_points_5,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_network_density_points_5_0(feature));
            },
        });
        bounds_group.addLayer(layer_network_density_points_5);
        map.addLayer(layer_network_density_points_5);
        map.createPane('pane_flood_susceptibility_6');
        map.getPane('pane_flood_susceptibility_6').style.zIndex = 406;
        var img_flood_susceptibility_6 = 'data/flood_susceptibility_6.png';
        var img_bounds_flood_susceptibility_6 = [[25.157323917526217,83.05369786694469],[25.257089148767637,83.13474569349565]];
        var layer_flood_susceptibility_6 = new L.imageOverlay(img_flood_susceptibility_6,
                                              img_bounds_flood_susceptibility_6,
                                              {pane: 'pane_flood_susceptibility_6'});
        bounds_group.addLayer(layer_flood_susceptibility_6);
        map.addLayer(layer_flood_susceptibility_6);
        const url = {"Nominatim OSM": "https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&",
        "France BAN": "https://api-adresse.data.gouv.fr/search/?"}
        var photonControl = L.control.photon({
            url: url["Nominatim OSM"],
            feedbackLabel: '',
            position: 'topleft',
            includePosition: true,
            initial: true,
            // resultsHandler: myHandler,
        }).addTo(map);
        photonControl._container.childNodes[0].style.borderRadius="10px"
        // Create a variable to store the geoJSON data
        var x = null;
        // Create a variable to store the marker
        var marker = null;
        // Add an event listener to the Photon control to create a marker from the returned geoJSON data
        var z = null;
        photonControl.on('selected', function(e) {
            console.log(photonControl.search.resultsContainer);
            if (x != null) {
                map.removeLayer(obj3.marker);
                map.removeLayer(x);
            }
            obj2.gcd = e.choice;
            x = L.geoJSON(obj2.gcd).addTo(map);
            var label = typeof obj2.gcd.properties.label === 'undefined' ? obj2.gcd.properties.display_name : obj2.gcd.properties.label;
            obj3.marker = L.marker(x.getLayers()[0].getLatLng()).bindPopup(label).addTo(map);
            map.setView(x.getLayers()[0].getLatLng(), 17);
            z = typeof e.choice.properties.label === 'undefined'? e.choice.properties.display_name : e.choice.properties.label;
            console.log(e);
            e.target.input.value = z;
        });
        var search = document.getElementsByClassName("leaflet-photon leaflet-control")[0];
        search.classList.add("leaflet-control-search")
        search.style.display = "flex";
        search.style.backgroundColor="rgba(255,255,255,0.5)" 

        // Create the new button element
        var button = document.createElement("div");
        button.id = "gcd-button-control";
        button.className = "gcd-gl-btn fa fa-search search-button";

        // Insert the button at the beginning of the search control
        search.insertBefore(button, search.firstChild);
        last = search.lastChild;
        last.style.display = "none";
        button.addEventListener("click", function (e) {
            if (last.style.display === "none") {
                last.style.display = "block";
            } else {
                last.style.display = "none";
            }
        });
        var overlaysTree = [
            {label: "flood_susceptibility", layer: layer_flood_susceptibility_6},
            {label: '<img src="legend/network_density_points_5.png" /> network_density_points', layer: layer_network_density_points_5},
            {label: "network_density", layer: layer_network_density_4},
            {label: "flood_susceptibility_final", layer: layer_flood_susceptibility_final_3},
            {label: '<img src="legend/Linesfinal_2.png" /> Lines final', layer: layer_Linesfinal_2},
            {label: "main_river_channel", layer: layer_main_river_channel_1},
            {label: "river_hillshade", layer: layer_river_hillshade_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        </script>        
    </body>
</html>
